name: 更新恐贪数据

on:
  workflow_dispatch:
  schedule:
    - cron: "40 7 * * 1-5"
    - cron: "10 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: fear-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: 抓取韭圈儿恐贪
        run: python scripts/fetch_fear.py

      - name: 提交数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fear.json data/fear.js
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: 更新恐贪数据"
            git push
          fi

      - name: 发送每日邮件
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '40 7 * * 1-5'
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
        run: |
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_TO" ]; then
            echo "未配置邮件密钥（MAIL_USERNAME / MAIL_PASSWORD / MAIL_TO），跳过发信"
            exit 0
          fi
          python scripts/daily_mail.py
